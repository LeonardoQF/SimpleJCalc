name: java-ci

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout the code
              uses: actions/checkout@V4
            
            - name: Setup Java
              uses: actions/setup-java@v6
              with:
                java-version: '21'
                distribution: 'temurin'

            - name: Run tests
              run: ./mvn test

